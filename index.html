<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYZ AI - School Assistant</title>
<style>
  :root {
    --ink: #1b2430;
    --paper: #f6f4ee;
    --accent: #2f6f5e;
    --accent-soft: #e4efe9;
    --line: #d8d3c6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Roboto, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--ink);
    color: var(--paper);
  }
  header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 0.03em; }
  header p { margin: 4px 0 0; font-size: 0.8rem; opacity: 0.7; }

  #setup {
    padding: 14px 20px;
    background: var(--accent-soft);
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    font-size: 0.85rem;
  }
  #setup input, #setup select {
    padding: 6px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    font-size: 0.85rem;
  }
  #apiKey { flex: 1; min-width: 180px; }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.4;
    font-size: 0.95rem;
    white-space: pre-wrap;
  }
  .user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 2px; }
  .ai { align-self: flex-start; background: white; border: 1px solid var(--line); border-bottom-left-radius: 2px; }
  .system { align-self: center; font-size: 0.75rem; color: #888; }

  #escalate {
    align-self: flex-start;
    background: #fff4e0;
    border: 1px solid #e8c98a;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
  }

  form#inputBar {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    background: var(--paper);
  }
  #textInput {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    font-size: 0.95rem;
  }
  button {
    padding: 10px 18px;
    border-radius: 20px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <h1>XYZ AI — School Assistant</h1>
  <p>Chat with the school AI as a Student, Parent, Teacher or Principal</p>
</header>

<div id="setup">
  <label>Role:
    <select id="roleSelect">
      <option value="student">Student (Rahul)</option>
      <option value="parent">Parent (Rahul's parent)</option>
      <option value="teacher">Teacher</option>
      <option value="principal">Principal</option>
    </select>
  </label>
  <input id="apiKey" type="password" placeholder="Paste your Anthropic API key here (kept only in this browser tab)">
</div>

<div id="chat"></div>

<form id="inputBar">
  <input id="textInput" type="text" placeholder="Type your message..." autocomplete="off">
  <button type="submit">Send</button>
</form>

<script>
// ---------- 1. FAKE SCHOOL DATABASE (mock API) ----------
const mockDB = {
  students: {
    "rahul": { name: "Rahul Sharma", class: "8B", attendance: "91.2%", marks: { Math: 88, Science: 92, English: 79 }, parent: "Suresh Sharma" }
  },
  schoolStats: { overallAttendance: "89.4%", totalStudents: 640, totalTeachers: 32 }
};

function mockAttendanceLookup(studentKey) {
  const s = mockDB.students[studentKey];
  return s ? `${s.name}'s attendance is ${s.attendance}.` : "Student not found.";
}
function mockMarkAttendance(studentKey, status) {
  if (!mockDB.students[studentKey]) return "Student not found.";
  return `${mockDB.students[studentKey].name} marked ${status} for today.`;
}
function mockSchoolStats() {
  return `Overall school attendance is ${mockDB.schoolStats.overallAttendance} across ${mockDB.schoolStats.totalStudents} students.`;
}

// ---------- 2. PERSONA / SYSTEM PROMPT PER ROLE ----------
const personas = {
  student: `You are XYZ AI, a friendly and supportive Academic Assistant for a student named Rahul (class 8B). You may ONLY share Rahul's own data. You cannot mark attendance or see other students' data. If asked something outside your permission, politely refuse and explain why.`,
  parent: `You are XYZ AI, a caring and patient Parent Support Assistant. You are talking to Rahul's parent (Suresh Sharma). You may share Rahul's data only. You cannot mark attendance. If the parent is unhappy, offer to escalate to the teacher or school management.`,
  teacher: `You are XYZ AI, a professional Teaching Assistant. You are talking to a Teacher. Teachers can mark attendance for students and view class data, but cannot see school-wide financial or admin data.`,
  principal: `You are XYZ AI, a professional Management Assistant. You are talking to the Principal, who can see overall school analytics, but should not perform teacher-only actions like marking daily attendance directly.`
};

const roleKey = { student: "rahul", parent: "rahul", teacher: "rahul", principal: null };

// ---------- 3. SIMPLE MOCK-API ROUTER (very basic intent detection) ----------
function tryMockAction(role, text) {
  const lower = text.toLowerCase();
  if ((role === "student" || role === "parent") && lower.includes("attendance")) {
    return mockAttendanceLookup(roleKey[role]);
  }
  if (role === "teacher" && lower.includes("mark") && lower.includes("absent")) {
    return mockMarkAttendance("rahul", "absent");
  }
  if (role === "teacher" && lower.includes("mark") && lower.includes("present")) {
    return mockMarkAttendance("rahul", "present");
  }
  if (role === "principal" && lower.includes("attendance")) {
    return mockSchoolStats();
  }
  return null; // no mock action matched — let the AI just respond conversationally
}

// ---------- 4. CHAT LOGIC ----------
const chatEl = document.getElementById('chat');
const form = document.getElementById('inputBar');
const textInput = document.getElementById('textInput');
const roleSelect = document.getElementById('roleSelect');
const apiKeyInput = document.getElementById('apiKey');

let history = []; // {role: 'user'|'assistant', content: '...'}

function addMsg(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addEscalateButton() {
  const btn = document.createElement('div');
  btn.id = 'escalate';
  btn.textContent = '📞 Talk to Teacher / Contact School Management';
  btn.onclick = () => {
    addMsg('Your request has been submitted. A teacher will contact you soon. (mock action)', 'system');
    btn.remove();
  };
  chatEl.appendChild(btn);
  chatEl.scrollTop = chatEl.scrollHeight;
}

addMsg('Hi! I am XYZ AI, your school assistant. Pick your role above and ask me anything — e.g. "What is my attendance?"', 'ai');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = textInput.value.trim();
  if (!text) return;
  const role = roleSelect.value;

  addMsg(text, 'user');
  history.push({ role: 'user', content: text });
  textInput.value = '';

  // "I am not satisfied" -> show escalation
  if (/not satisfied|talk to teacher|contact school|human/i.test(text)) {
    addMsg('I understand. I can connect you with a real person if you would like.', 'ai');
    addEscalateButton();
    return;
  }

  // Try mock API first (this is the "authorized action" layer, not the LLM)
  const mockResult = tryMockAction(role, text);

  const apiKey = apiKeyInput.value.trim();
  if (!apiKey) {
    // No API key -> just answer using mock data if we have it
    if (mockResult) {
      addMsg(mockResult, 'ai');
    } else {
      addMsg('(Add an API key above for full AI replies. For now: try asking about "attendance".)', 'system');
    }
    return;
  }

  const thinking = addMsg('...', 'ai');
  try {
    const systemPrompt = personas[role] + (mockResult ? `\n\nHere is real data from the school system to use in your answer: "${mockResult}"` : '\n\nNo matching school-system data was found for this message; respond naturally and ask for clarification if needed.');

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 300,
        system: systemPrompt,
        messages: history
      })
    });
    const data = await response.json();
    const replyText = data?.content?.[0]?.text || "Sorry, I could not process that.";
    thinking.textContent = replyText;
    history.push({ role: 'assistant', content: replyText });
  } catch (err) {
    thinking.textContent = "Error reaching the AI. Check your API key and internet connection.";
  }
});
</script>

</body>
</html>
